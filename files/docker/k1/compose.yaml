# K1 runtime shape — HARDENED (6B-7). Internal network, no published ports.
# Canonical path: files/docker/k1/compose.yaml (see files/K1-CONTAINER-PLAN.md).
# Bind: 127.0.0.1 only (fake provider inside the container).
# /work: rw,exec (required to execute built artifacts per K1 contract).
# Compensating controls for exec (noexec dropped): internal-only network,
# read-only rootfs, cap-drop ALL + no-new-privileges, non-root uid 10001,
# tmpfs nosuid/nodev; /tmp,/run,/home/k1 remain noexec,nosuid,nodev.
# Pins: see image-pins.json. Offline build: --pull=false, no pull to obtain pins.
name: k1

services:
  app:
    image: k1-app:latest
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: ["k1-internal"]
    # No ports: key while loopback-only (never "0.0.0.0:5432"/"8081").
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0755
      - /work:rw,exec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0755
      - /home/k1:rw,noexec,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0755
    volumes:
      - type: bind
        source: ${K1_BASE:-./repo-base}
        target: /repo/base
        read_only: true
      - type: bind
        source: ${K1_HEAD:-./repo-head}
        target: /repo/head
        read_only: true
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: 1.0
          pids: 256

  pg:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    read_only: true
    networks: ["k1-internal"]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=96m
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: k1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?per-run generated by harness}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.5

networks:
  k1-internal:
    internal: true
    driver: bridge
